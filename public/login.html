<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nonco Stables — Sign in</title>

<style>
  /* ─── Self-hosted fonts (no Google Fonts CDN) ─── */
  @font-face{
    font-family:"Space Grotesk";
    src:url("/fonts/SpaceGrotesk-Variable.woff2") format("woff2");
    font-weight:300 700;font-style:normal;font-display:swap;
  }

  /* ─── Design tokens — mirrored from src/app/globals.css ─── */
  :root{
    --bg:#000000;
    --bg-card:#141414;
    --text:rgba(255,255,255,0.88);
    --text-2:rgba(255,255,255,0.65);
    --text-3:rgba(255,255,255,0.45);
    --text-4:rgba(255,255,255,0.5);
    --cyan:#05E0F8;
    --cyan-dark:#04b0c4;
    --border:#1a1a1a;
    --border-outline:#3b494c;
    --font-sans:"Space Grotesk",sans-serif;
    --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);}
  body{
    font-family:var(--font-sans);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ─── Full-screen particle canvas (background) ─── */
  #scene{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:0;display:block;
  }
  /* Radial vignette: light touch — keeps globe/coin color vivid, just adds a
     soft pocket behind the box and a gentle edge falloff for legibility */
  #vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(135% 105% at 50% 50%, transparent 40%, rgba(0,0,0,0.45) 100%),
      radial-gradient(40% 36% at 50% 50%, rgba(0,0,0,0.55) 0%, transparent 72%);
  }

  /* ─── Login layer ─── */
  #layer{
    position:fixed;inset:0;z-index:2;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }

  /* Solid black login box on top of the animation */
  .box{
    position:relative;width:100%;max-width:380px;
    background:#000000;
    border:1px solid var(--border-outline);
    border-radius:16px;
    padding:44px 36px 32px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 40px 120px -20px rgba(0,0,0,0.9),
      0 0 70px -42px rgba(5,224,248,0.3);
    opacity:0;transform:translateY(16px);
    animation:rise 0.8s var(--ease-out-expo) 0.15s forwards;
  }
  @keyframes rise{to{opacity:1;transform:translateY(0);}}

  /* Logo */
  .logo{display:flex;justify-content:center;margin-bottom:24px;}
  .logo svg{height:20px;width:auto;display:block;}

  /* Brand line */
  .brandline{
    text-align:center;font-size:12px;letter-spacing:.04em;
    color:var(--text-3);margin-bottom:26px;
  }

  /* Login form */
  .form{display:flex;flex-direction:column;gap:14px;margin-bottom:22px;}
  .field{display:flex;flex-direction:column;gap:7px;}
  .lbl-row{display:flex;align-items:center;justify-content:space-between;}
  .lbl{
    font-size:10px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--text-4);margin-left:2px;
  }
  .forgot{
    background:none;border:0;cursor:pointer;padding:2px 4px;
    font-family:var(--font-sans);font-size:11px;letter-spacing:.04em;
    color:var(--text-4);transition:color .2s ease;
  }
  .forgot:hover{color:#fff;}
  .input{
    width:100%;height:46px;border-radius:10px;padding:0 14px;
    background:var(--bg-card);color:var(--text);
    border:1px solid var(--border-outline);
    font-family:var(--font-sans);font-size:14px;letter-spacing:-0.005em;
    outline:none;transition:border-color .2s ease, box-shadow .2s ease;
  }
  .input::placeholder{color:var(--text-4);}
  .input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(5,224,248,0.12);}

  /* Buttons */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;height:48px;border-radius:10px;cursor:pointer;
    font-family:var(--font-sans);font-size:14px;font-weight:500;letter-spacing:-0.01em;
    border:1px solid transparent;
    transition:transform .15s var(--ease-out-expo),
               background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn svg{flex:0 0 auto;}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:scale(0.985);}

  /* Primary — Continue with Google */
  .btn-google{
    background:#ffffff;color:#1f1f1f;font-weight:500;
  }
  .btn-google:hover{box-shadow:0 8px 24px -8px rgba(255,255,255,0.25);}
  .btn-google:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  /* Primary — Sign in (cyan) */
  .btn-primary{
    background:var(--cyan);color:#001417;font-weight:600;
  }
  .btn-primary:hover{box-shadow:0 8px 28px -10px rgba(5,224,248,0.5);}
  .btn-primary:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  /* Secondary — Connect Wallet (ghost) */
  .btn-ghost{
    background:transparent;color:var(--text);
    border-color:var(--border-outline);
    margin-top:12px;
  }
  .btn-ghost:hover{border-color:#ffffff;background:rgba(255,255,255,0.02);}
  .btn-ghost:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  /* Divider */
  .divider{
    display:flex;align-items:center;gap:12px;margin:20px 0;
  }
  .divider .line{flex:1;height:1px;background:var(--border-outline);opacity:.5;}
  .divider span{font-size:11px;color:var(--text-4);text-transform:uppercase;letter-spacing:.1em;}

  /* Terms footer */
  .terms{
    font-size:11px;color:var(--text-4);text-align:center;
    margin-top:28px;line-height:1.6;
  }
  .terms a{color:var(--text-3);text-decoration:underline;text-underline-offset:3px;
    text-decoration-color:var(--border-outline);transition:color .2s ease;}
  .terms a:hover{color:#fff;}

  /* Reduced motion */
  @media (prefers-reduced-motion:reduce){
    .box{animation:none;opacity:1;transform:none;}
  }
</style>
</head>

        </svg>

  <!-- ─── Three.js — vanilla port of <ParticleGlobe> ─── -->
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.183.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    // ─── Config — copied verbatim from src/components/ui/particle-globe.tsx ───
    const ACCENT = "#05E0F8";
    const AMBIENT_RGB = [0.02, 0.878, 0.973];
    // Tuned for a subtle, elegant backdrop: camera pushed back so the orbital
    // system reads small and ambient, letting the login box hold focus.
    const CONFIG = {
      cam: { dist: 280 },
      globe: { radius: 90, particles: 1600, rotSpeed: 0.06 },
      rings: [
        { items: ["USDC","USDT","DAI","TUSD","GUSD","PAX","BUSD","FRAX"],
          radius: 150, speed: 0.1, tiltX: 65, tiltZ: 25, size: 18, isLogo: true },
        { items: ["$","€","£","¥","₹","₩","MX$","R$","A$","C$","S$","CHF","₺","₽","฿","₱"],
          radius: 200, speed: -0.08, tiltX: 65, tiltZ: -25, size: 15, isLogo: false },
      ],
      ambient: { count: 900, spreadMin: 260, spreadMax: 820, sizeMin: 1.5, sizeMax: 4.5 },
    };

    const DEG = Math.PI / 180;

    // ─── Fibonacci sphere ───
    function fibSphere(n, r){
      const pos = new Float32Array(n * 3);
      const gr = (1 + Math.sqrt(5)) / 2;
      for (let i = 0; i < n; i++){
        const theta = (2 * Math.PI * i) / gr;
        const phi = Math.acos(1 - 2 * (i + 0.5) / n);
        pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = r * Math.cos(phi);
      }
      return pos;
    }

    // ─── Canvas sprite textures (badge for stablecoins, glyph for fiat) ───
    function makeTexture(canvas){
      const t = new THREE.CanvasTexture(canvas);
      t.minFilter = THREE.LinearFilter;
      t.magFilter = THREE.LinearFilter;
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const SYMBOLS = { USDC:"$", USDT:"₮", DAI:"◆", TUSD:"T", GUSD:"G", PAX:"P", BUSD:"B", FRAX:"F" };

    function logoTexture(text, accent, sz = 256){
      const c = document.createElement("canvas"); c.width = c.height = sz;
      const ctx = c.getContext("2d");
      const cx = sz/2, r = cx * 0.82;
      const h = accent.replace("#","");
      const [rR,gR,bR] = [0,2,4].map(i => parseInt(h.slice(i,i+2),16));
      ctx.beginPath(); ctx.arc(cx,cx,r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${rR},${gR},${bR},0.15)`; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cx,r,0,Math.PI*2);
      ctx.strokeStyle = `rgba(${rR},${gR},${bR},0.6)`; ctx.lineWidth = sz*0.035; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cx,r*0.75,0,Math.PI*2);
      ctx.strokeStyle = `rgba(${rR},${gR},${bR},0.1)`; ctx.lineWidth = sz*0.01; ctx.stroke();
      ctx.fillStyle = accent;
      ctx.font = `800 ${sz*0.4}px "Space Grotesk", -apple-system, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(SYMBOLS[text] ?? text[0], cx, cx);
      return makeTexture(c);
    }
    function currencyTexture(text, accent, sz = 256){
      const c = document.createElement("canvas"); c.width = c.height = sz;
      const ctx = c.getContext("2d");
      ctx.clearRect(0,0,sz,sz);
      ctx.fillStyle = accent;
      const fs = text.length > 2 ? sz*0.32 : text.length > 1 ? sz*0.45 : sz*0.6;
      ctx.font = `700 ${fs}px "Space Grotesk", -apple-system, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(text, sz/2, sz/2);
      return makeTexture(c);
    }

    // ─── Renderer / scene / camera ───
    const canvas = document.getElementById("scene");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true,
      powerPreference: "high-performance" });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 100, 700);

    const camera = new THREE.PerspectiveCamera(50, 1, 1, 1500);
    camera.position.set(0, 0, CONFIG.cam.dist);
    camera.lookAt(0, 0, 0);

    // ─── Globe ───
    const globeGeo = new THREE.BufferGeometry();
    globeGeo.setAttribute("position",
      new THREE.BufferAttribute(fibSphere(CONFIG.globe.particles, CONFIG.globe.radius), 3));
    const globe = new THREE.Points(globeGeo, new THREE.PointsMaterial({
      color: ACCENT, size: 1.4, sizeAttenuation: true, transparent: true,
      opacity: 0.95, depthWrite: false,
    }));
    scene.add(globe);

    // ─── Orbital rings (coin rings) ───
    const ringSpinners = [];
    for (const ring of CONFIG.rings){
      const tilt = new THREE.Group();
      tilt.rotation.set(ring.tiltX * DEG, 0, ring.tiltZ * DEG);
      const spinner = new THREE.Group();
      tilt.add(spinner);
      ring.items.forEach((item, i) => {
        const a = (i / ring.items.length) * Math.PI * 2;
        const tex = ring.isLogo ? logoTexture(item, ACCENT) : currencyTexture(item, ACCENT);
        const spr = new THREE.Sprite(new THREE.SpriteMaterial({
          map: tex, transparent: true, depthWrite: false, opacity: 0.95,
        }));
        spr.position.set(Math.cos(a) * ring.radius, 0, Math.sin(a) * ring.radius);
        spr.scale.set(ring.size, ring.size, 1);
        spinner.add(spr);
      });
      scene.add(tilt);
      ringSpinners.push({ spinner, speed: ring.speed });
    }

    // ─── Ambient particles (custom shader, size-attenuated) ───
    const ac = CONFIG.ambient.count;
    const aPos = new Float32Array(ac * 3), aSize = new Float32Array(ac);
    for (let i = 0; i < ac; i++){
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      const r = CONFIG.ambient.spreadMin + Math.random() * (CONFIG.ambient.spreadMax - CONFIG.ambient.spreadMin);
      aPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
      aPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
      aPos[i*3+2] = r * Math.cos(ph);
      aSize[i] = CONFIG.ambient.sizeMin + Math.random() * (CONFIG.ambient.sizeMax - CONFIG.ambient.sizeMin);
    }
    const aGeo = new THREE.BufferGeometry();
    aGeo.setAttribute("position", new THREE.BufferAttribute(aPos, 3));
    aGeo.setAttribute("size", new THREE.BufferAttribute(aSize, 1));
    const ambient = new THREE.Points(aGeo, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uColor: { value: new THREE.Vector3(...AMBIENT_RGB) } },
      vertexShader: `
        attribute float size;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (250.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform vec3 uColor;
        void main(){
          if (length(gl_PointCoord - 0.5) > 0.5) discard;
          gl_FragColor = vec4(uColor, 0.75);
        }`,
    }));
    scene.add(ambient);

    // ─── Resize (DPR clamped [1,2]) ───
    function resize(){
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    // ─── Animation loop ───
    const clock = new THREE.Clock();
    function tick(){
      const dt = clock.getDelta();
      globe.rotation.y += dt * CONFIG.globe.rotSpeed;
      for (const r of ringSpinners) r.spinner.rotation.y += dt * r.speed;
      ambient.rotation.y += dt * 0.04;
      ambient.rotation.x += dt * 0.012;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();

    // ─── Visual-only auth (no live OAuth) ───
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "/dashboard";
    });
    document.getElementById("googleBtn").addEventListener("click", () => {
      window.location.href = "/dashboard";
    });
    document.getElementById("walletBtn").addEventListener("click", () => {
      window.location.href = "/dashboard";
    });
  </script>
</body>
</html>
